<!DOCTYPE html>
<html 
    lang="{{ 'ar' if g.lang=='ar' else 'en' }}"
    dir="{{ 'rtl' if g.lang=='ar' else 'ltr' }}"
>

<head>
    <meta charset="UTF-8">
    <title>{{ tr('add_user', 'إضافة موظف') }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f3f5fb;
            font-family: "Segoe UI", Tahoma, sans-serif;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            padding: 15px;
        }

        .lang-switch {
            background: white;
            padding: 5px 12px;
            border-radius: 6px;
            color: #0b5ed7;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #0b5ed7;
            margin-left: 8px;
        }

        .card-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            max-width: 500px;
            margin: auto;
            margin-top: 40px;
        }

        .title {
            font-size: 28px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 25px;
            color: #0b5ed7;
        }

        .btn-submit {
            background: #0b5ed7;
            color: white;
            width: 100%;
            padding: 10px;
            font-size: 17px;
        }

        .btn-submit:hover {
            background: #0948a1;
        }

        .btn-back {
            background: #dc3545;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .btn-back:hover {
            background: #b32a38;
        }
    </style>
</head>

<body>

    <!-- أزرار اللغة -->
    <div class="top-bar">
        <a href="/set-lang/ar" class="lang-switch">عربي</a>
        <a href="/set-lang/en" class="lang-switch">English</a>
    </div>

    <div class="container">

        <!-- زر الرجوع -->
        <div class="mt-4 mb-2">
            <a href="/admin/users" class="btn-back">⟵ {{ tr('back','رجوع') }}</a>
        </div>

        <!-- الصندوق -->
        <div class="card-box">
            <div class="title">➕ {{ tr('add_user','إضافة موظف') }}</div>

            <form method="POST">

                <label class="mb-2">{{ tr('username','اسم المستخدم') }}</label>
                <input type="text"
                       name="username"
                       class="form-control mb-3"
                       placeholder="{{ tr('enter_username','اكتب اسم المستخدم') }}"
                       required>

                <label class="mb-2">{{ tr('password','كلمة المرور') }}</label>
                <input type="password"
                       name="password"
                       class="form-control mb-4"
                       placeholder="{{ tr('enter_password','اكتب كلمة المرور') }}"
                       required>

                <button class="btn-submit">{{ tr('add','إضافة') }}</button>
            </form>

        </div>

    </div>

</body>

</html>
