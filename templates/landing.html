<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام الكول سنتر الذكي</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        /* فيديو الخلفية */
        .bg-video {
            position: fixed;
            width: 100%;
            height: 100%;
            object-fit: cover;
            top: 0; left: 0;
            filter: brightness(50%);
            z-index: -2;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: -1;
        }

        /* المحتوى */
        .center-box {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        h1 {
            font-size: 46px;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 35px;
            opacity: 0.85;
        }

        .btn {
            padding: 15px 30px;
            background: #0b5ed7;
            color: #fff;
            border: none;
            text-decoration: none;
            font-size: 18px;
            border-radius: 10px;
            transition: 0.2s;
        }

        .btn:hover {
            background: #0949a6;
        }

        /* فوتر */
        .footer {
            position: fixed;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 13px;
            color: #ddd;
        }
    </style>
</head>

<body>

<video class="bg-video" autoplay muted loop>
    <source src="/static/login_bg.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="center-box">
    <h1>⚡ نظام الكول سنتر الذكي</h1>
    <h2>تحويل المكالمات الصوتية إلى تقارير دقيقة باستخدام الذكاء الاصطناعي</h2>

    <a class="btn" href="/login">تسجيل الدخول</a>
</div>

<div class="footer">
    جميع الحقوق محفوظة — النسخة الاحترافية من نظام الكول سنتر
</div>

</body>
</html>
